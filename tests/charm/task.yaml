###########################################
# IMPORTANT
# Comments matter!
# The docs use the wrapping comments as
# markers for including said instructions
# as snippets in the docs.
###########################################
summary: Example charm tutorial

kill-timeout: 10m

execute: |
  runme run "info on k8s"
  runme run "info on k8s worker"
  runme run "install k8s charm"
  # The watch needs this exported to work
  export TERM=xterm-256color
  juju wait-for machine 0
  # Wait for does not exit so commenting this out
  # runme run "watch juju status"
  runme run "install k8s worker charm"
  juju wait-for machine 1
  runme run "integrate worker"
  juju status 
  sleep 60 
  juju status
  # Again watch will just time out eventually
  #runme run "watch juju status"

