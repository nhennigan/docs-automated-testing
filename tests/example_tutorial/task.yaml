:caption: ~/spread_test_example/tests/example_tutorial/task.yaml

summary: Example tutorial

kill-timeout: 10m

execute: |
  function repeat_checks {
    MAX_RETRIES=15
    for i in $(seq 1 $MAX_RETRIES); do
      echo $i
      runme run "$1" > output.txt
      cat output.txt
      if grep -q "$2" output.txt ; then
        break
      elif [[ "$i" == "$MAX_RETRIES" ]]; then
        exit 1
      else
        sleep 1
      fi
    done
  }
  
  runme run "install snap"
  runme run "bootstrap cluster"
  runme run "Wait for the cluster to be ready"
  repeat_checks "get nodes" 'Ready'
  runme run "get services"
  runme run "deploy nginx"
  repeat_checks "check nginx" "Running"
  runme run "remove nginx"
  repeat_checks "check nginx removed" "No resources found in default namespace."
  runme run "enable local storage"
  repeat_checks "check local storage" "enabled at /var/snap/k8s/common/rawfile-storage" 
  runme run "create pod with pvc"
  repeat_checks "view pvc" "Bound"
  repeat_checks "view pvc pod" "Running"
  runme run "remove pod and pvc"
  runme run "disable local storage" 

